spring.application.name=banco-digital-backend
server.port=${PORT:8080}

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

jwt.secret=${JWT_SECRET}
jwt.expiration-ms=3600000
# Purga de la lista negra de tokens (HU8): por defecto, al inicio de cada hora.
jwt.revocados.purga-cron=${JWT_REVOCADOS_PURGA_CRON:0 0 * * * *}

# Swagger / OpenAPI
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.operationsSorter=alpha
springdoc.swagger-ui.tagsSorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true

# Observabilidad (Actuator + Micrometer + Prometheus)
# Los endpoints de gestion viven en un puerto aparte (8081 por defecto) que no se
# publica en Render; Prometheus lo raspa dentro de la red de Docker.
management.server.port=${MANAGEMENT_PORT:8081}
management.endpoints.web.exposure.include=health,info,metrics,prometheus
management.endpoint.health.probes.enabled=true
management.endpoint.health.show-details=never
management.metrics.tags.application=${spring.application.name}
# Histograma de latencia por endpoint para calcular percentiles en Grafana
management.metrics.distribution.percentiles-histogram.http.server.requests=true
management.observations.annotations.enabled=true
