groups:
  - name: banco-digital
    rules:
      - alert: ApiCaida
        expr: up{job="banco-digital-api"} == 0
        for: 1m
        labels: { severidad: critica }
        annotations:
          resumen: "Prometheus no logra raspar la API del Banco Digital"

      - alert: TasaDeErrores5xxAlta
        expr: |
          sum(rate(http_server_requests_seconds_count{application="banco-digital-backend", status=~"5.."}[5m]))
            / clamp_min(sum(rate(http_server_requests_seconds_count{application="banco-digital-backend"}[5m])), 0.001) > 0.05
        for: 5m
        labels: { severidad: alta }
        annotations:
          resumen: "Mas del 5 % de las respuestas son 5xx"

      - alert: LatenciaP95Alta
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(http_server_requests_seconds_bucket{application="banco-digital-backend", uri!~"/actuator.*"}[5m]))) > 1
        for: 5m
        labels: { severidad: media }
        annotations:
          resumen: "El percentil 95 de latencia supera 1 s"

      - alert: RafagaDeRechazosDeAutenticacion
        expr: |
          sum(rate(http_server_requests_seconds_count{application="banco-digital-backend", status="401"}[5m])) * 60 > 30
        for: 2m
        labels: { severidad: media }
        annotations:
          resumen: "Mas de 30 respuestas 401 por minuto (posible fuerza bruta o tokens robados)"

      - alert: PoolDeConexionesSaturado
        expr: hikaricp_connections_pending{application="banco-digital-backend"} > 0
        for: 2m
        labels: { severidad: media }
        annotations:
          resumen: "Hay peticiones esperando conexion a PostgreSQL"
